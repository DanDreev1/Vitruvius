<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1020" />
    <title>Vitruvius — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0b1020;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 25%, rgba(214, 178, 94, 0.16), transparent 32rem),
          #0b1020;
      }

      main {
        width: min(28rem, calc(100vw - 3rem));
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.5rem;
        background: rgba(24, 33, 53, 0.86);
        text-align: center;
        box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.32);
      }

      img {
        width: 5.5rem;
        height: auto;
      }

      h1 {
        margin: 1.25rem 0 0;
        color: #d6b25e;
        font-size: 2rem;
        line-height: 1;
      }

      p {
        margin: 1rem 0 0;
        color: rgba(255, 255, 255, 0.68);
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/Logo_Icon.png" alt="" />
      <h1>Vitruvius is offline</h1>
      <p>Reconnect to continue your session.</p>
    </main>
  </body>
</html>
